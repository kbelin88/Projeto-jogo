<!doctype html>
<meta charset="utf-8">
<title>Bancada das montanhas</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1418; color: #e8dcc0;
               font: 13px system-ui, sans-serif; overflow: hidden; }
  #palco { position: fixed; inset: 0; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 5; width: 270px;
         background: rgba(20,15,8,.9); border: 1px solid #6b5836;
         border-radius: 8px; padding: 10px 12px; }
  #hud h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: .06em; }
  #hud p { color: #cbbd94; line-height: 1.45; margin: 8px 0 0; }
  #hud button { background: #3a2e18; color: #e8dcc0; border: 1px solid #6b5836;
                border-radius: 5px; padding: 5px 9px; margin: 4px 4px 0 0;
                cursor: pointer; font: inherit; }
  #hud button:hover { background: #55401f; }
  #carga { position: fixed; inset: 0; display: flex; align-items: center;
           justify-content: center; background: #0d1418; z-index: 9; color: #cbbd94; }
</style>
<div id="palco"></div>
<div id="carga">a montar as montanhas...</div>
<div id="hud">
  <h1>BANCADA DAS MONTANHAS</h1>
  <div id="botoes"></div>
  <p>Tres estilos esculpidos no mapa de teste (Lisboa e Santarem). Cada botao
     leva a camara a um. Arrasta para girar, roda para aproximar.</p>
  <p id="nota"></p>
</div>

<script type="module">
// A montra das montanhas de teste. O forno e o do mapa:
//   BANCADA="lisboa,santarem" MONTANHAS=1 blender -b ... -P ferramentas/cena/exportar_mapa.py
// Nada daqui toca o jogo: le `montanhas.glb` e `montanhas.json`.
import { iniciar } from "./mapa3d.js";

// ?cena=mapa_montanhas abre a Iberia inteira com as montanhas (MONTANHAS=1 sem BANCADA)
const CENA = new URLSearchParams(location.search).get("cena") || "montanhas";
const mapa = await iniciar(document.getElementById("palco"), { cena: CENA });
mapa.atualizar({ turno: 0, aldeias: [], marchas: [] });
Object.assign(window, { mapa, cena: mapa.cena, cam: mapa.cam, ctrl: mapa.ctrl,
                        MAPA: mapa.MAPA, THREE: mapa.THREE });
document.getElementById("carga").remove();

const NOMES = { pico: "pico rochoso", serra: "serra arredondada",
                cordilheira: "cordilheira" };
function olhar(m, dist = 900, alto = 380, ang = 0.8) {
  const T = mapa.THREE;
  const z = 120;
  mapa.ctrl.target.set(m.p[0], z, -m.p[1]);
  mapa.cam.position.set(m.p[0] + Math.cos(ang) * dist, z + alto, -m.p[1] + Math.sin(ang) * dist);
  mapa.ctrl.update();
}
window.olhar = olhar;
const caixa = document.getElementById("botoes");
for (const [i, m] of (mapa.MAPA.montanhas || []).entries()) {
  const b = document.createElement("button");
  b.textContent = (NOMES[m.estilo] || m.estilo) + (CENA === "montanhas" ? "" : " " + (i + 1));
  b.onclick = () => olhar(m);
  caixa.appendChild(b);
}
// a PRAIA: a areia ganhou textura (ferramentas/cena/tex_areia.py); o botao
// aponta a um ponto da malha da areia, de cima e a meia distancia
const praia = document.createElement("button");
praia.textContent = "praia";
praia.onclick = () => {
  let areia = null;
  mapa.cena.traverse((o) => { if (!areia && o.isMesh && /areia/i.test(o.name)) areia = o; });
  if (!areia) return;
  const T = mapa.THREE, pos = areia.geometry.attributes.position, v = new T.Vector3();
  v.fromBufferAttribute(pos, Math.floor(pos.count * 0.5));
  areia.localToWorld(v);
  mapa.ctrl.target.copy(v);
  mapa.cam.position.set(v.x + 90, v.y + 70, v.z + 90);
  mapa.ctrl.update();
};
caixa.appendChild(praia);
const todas = document.createElement("button");
todas.textContent = "as tres";
todas.onclick = () => {
  const ms = mapa.MAPA.montanhas || [];
  const cx = ms.reduce((s, m) => s + m.p[0], 0) / Math.max(1, ms.length);
  const cy = ms.reduce((s, m) => s + m.p[1], 0) / Math.max(1, ms.length);
  olhar({ p: [cx, cy] }, CENA === "montanhas" ? 1500 : 2600, CENA === "montanhas" ? 900 : 1700, 1.2);
};
caixa.appendChild(todas);
todas.onclick();
</script>
