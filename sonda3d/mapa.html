<!doctype html>
<meta charset="utf-8">
<title>A Iberia em 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1418; color: #e8dcc0;
               font: 13px system-ui, sans-serif; overflow: hidden; }
  #tela { position: fixed; inset: 0; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 5; width: 250px;
         background: rgba(20,15,8,.88); border: 1px solid #6b5836;
         border-radius: 8px; padding: 10px 12px; }
  #hud h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: .06em; }
  #hud label { display: flex; align-items: center; gap: 7px; margin: 5px 0; }
  #hud p { color: #cbbd94; font-style: italic; line-height: 1.45; margin: 8px 0 0; }
  #med { position: fixed; top: 12px; right: 12px; z-index: 5; text-align: right;
         background: rgba(20,15,8,.88); border: 1px solid #6b5836;
         border-radius: 8px; padding: 9px 12px; font-variant-numeric: tabular-nums; }
  #med b { color: #f0d9a0; font-size: 17px; }
  #carga { position: fixed; inset: 0; display: flex; align-items: center;
           justify-content: center; background: #0d1418; z-index: 9;
           font-size: 15px; color: #cbbd94; }
</style>
<canvas id="tela"></canvas>
<div id="carga">a montar a Iberia...</div>
<div id="hud">
  <h1>A IBERIA EM 3D</h1>
  <label><input type="checkbox" id="sombras" checked> sombras</label>
  <label><input type="checkbox" id="mata" checked> mata</label>
  <label><input type="checkbox" id="tropas" checked> tropas em marcha</label>
  <label><input type="checkbox" id="parar"> parar o tempo</label>
  <label><input type="checkbox" id="alto"> vista de cima</label>
  <p>Arrasta para girar &middot; roda para aproximar &middot; botao direito
     para deslocar. Desce ate ao chao e passeia entre as aldeias.</p>
</div>
<div id="med"></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const cfgSol = await (await fetch("cena.json")).json();
const MAPA = await (await fetch("mapa3d.json")).json();
const [LX, LY] = MAPA.mapa_m;

const tela = document.getElementById("tela");
const rend = new THREE.WebGLRenderer({ canvas: tela, antialias: true });
rend.setPixelRatio(Math.min(devicePixelRatio, 1.5));
rend.shadowMap.enabled = true;
rend.shadowMap.type = THREE.PCFSoftShadowMap;
rend.toneMapping = THREE.AgXToneMapping;      // a mesma curva do forno
rend.toneMappingExposure = 1.05;

const cena = new THREE.Scene();
cena.background = new THREE.Color(0x7ea3b8);

// O MAR e um plano por baixo de tudo. A ilha e uma malha com a forma do alfa
// da arte, portanto a costa passa a ser uma BORDA de geometria e nao um
// esbatido de 16 pixeis por cima de um PNG -- que era a queixa de origem.
const mar = new THREE.Mesh(
  new THREE.PlaneGeometry(LX * 4, LY * 4),
  new THREE.MeshStandardMaterial({ color: 0x27596b, roughness: 0.42, metalness: 0.05 }));
mar.rotation.x = -Math.PI / 2;
// O MAR fica ABAIXO da terra, e nao a rasar. Estava a -6 m num mapa de 2,8 km:
// visto de cima, terra e agua liam-se coplanares e a costa era so uma mudanca
// de cor. Agora a ilha tem margem (a parede que desce ate -18 m) e o mar entra
// a meio dela -- ha um banco a separar as duas coisas.
mar.position.y = -11;
mar.receiveShadow = true;
cena.add(mar);
cena.fog = new THREE.Fog(0x7ea3b8, LX * 0.55, LX * 1.5);

const sol = new THREE.DirectionalLight(new THREE.Color(...cfgSol.sol.cor), 3.2);
const d = cfgSol.sol.direcao_yup;
sol.castShadow = true;
sol.shadow.mapSize.set(4096, 4096);
cena.add(sol, sol.target);
const ceu = new THREE.HemisphereLight(0xbcd8ef, 0x5c6340, 1.2);
cena.add(ceu);

const cam = new THREE.PerspectiveCamera(42, 1, 2, LX * 2.2);
cam.position.set(0, LY * 0.62, LY * 0.78);
const ctrl = new OrbitControls(cam, tela);
ctrl.enableDamping = true;
ctrl.maxPolarAngle = Math.PI * 0.497;
ctrl.minDistance = 12;
ctrl.maxDistance = LX * 1.3;

// ---- juntar a biblioteca as copias ---------------------------------------
// O ficheiro traz cada peca UMA vez; aqui cria-se um InstancedMesh por peca e
// enchem-se as matrizes. E o mesmo que o Cycles faz no forno -- uma malha,
// milhares de posicoes -- so que quem instancia agora e o WebGL. Exportar o
// mapa como geometria daria a mesma casa repetida trezentas vezes.
let nInst = 0, nTri = 0;
new GLTFLoader().load("pecas.glb", (g) => {
  // ── UMA PECA PODE SER VARIAS MALHAS ────────────────────────────────────
  // O glTF nao tem malhas com varios materiais: parte-as em PRIMITIVAS, uma por
  // material, e o `three` monta-as como filhas de um no. Uma arvore tem madeira
  // e folha; uma casa tem parede, telhado, porta e soalho.
  //
  // A primeira versao guardava `banco[nome] = malha` e ficava com a ULTIMA que
  // passasse. O efeito nao foi um erro -- foi a arvore a aparecer sem tronco,
  // seis metros no ar, e as aldeias quase vazias. Um defeito que se ve e nao se
  // explica, que e o pior tipo.
  //
  // Agora cada nome guarda a LISTA das suas primitivas, e cada uma recebe o
  // mesmo jogo de matrizes.
  const banco = {};
  const por_nome = (n, o) => { (banco[n] = banco[n] || []).push(o); };
  g.scene.traverse((o) => {
    if (!o.isMesh) return;
    if (o.parent && o.parent.name && o.parent !== g.scene) por_nome(o.parent.name, o);
    else por_nome(o.name, o);
  });

  const contaTri = (m) => (m.geometry.index ? m.geometry.index.count
                                           : m.geometry.attributes.position.count) / 3;
  // O CHAO E AS ESTRADAS entram inteiros, sem instanciar: sao peca unica, ha uma
  // so de cada. Nao lancam sombra -- sao superficies deitadas, e uma sombra de
  // uma superficie deitada sobre si propria so faz aquele riscado sujo.
  for (const nome of ["chao", "estradas"])
    for (const ch of (banco[nome] || [])) {
      ch.receiveShadow = true;
      ch.castShadow = false;
      cena.add(ch);
      nTri += contaTri(ch);
    }

  // CONTAR ANTES DE CRIAR: um InstancedMesh nasce com a contagem fixa e nao
  // cresce depois. Contar primeiro e mais barato do que adivinhar por cima.
  const quantas = {};
  const soma = (n) => { quantas[n] = (quantas[n] || 0) + 1; };
  for (const c of MAPA.copias) soma(c.peca);
  for (const m of MAPA.manchas) for (const t of MAPA.arranjos[m.b]) soma(t.peca);

  const inst = {};                    // nome -> lista de InstancedMesh
  for (const [nome, n] of Object.entries(quantas)) {
    const partes = banco[nome];
    if (!partes || !partes.length) continue;
    // OS ARBUSTOS NAO LANCAM SOMBRA. Sao 10.600 e medem meio metro: a sombra
    // deles nao se ve e paga-se em cada quadro, porque cada objeto que lanca
    // sombra e desenhado outra vez para o mapa do sol.
    const arbusto = /^arbusto/.test(MAPA.pecas[nome] || nome);
    inst[nome] = partes.map((base) => {
      const im = new THREE.InstancedMesh(base.geometry, base.material, n);
      im.castShadow = !arbusto; im.receiveShadow = true;
      im.frustumCulled = false;
      im.count = 0;                     // preenche-se a seguir
      cena.add(im);
      nTri += contaTri(base) * n;
      return im;
    });
  }

  const M = new THREE.Matrix4(), Q = new THREE.Quaternion();
  const V = new THREE.Vector3(), E = new THREE.Vector3(), R = new THREE.Euler();
  // O BLENDER E Z-PARA-CIMA e o exportador virou a cena para Y-para-cima. As
  // colocacoes foram gravadas em coordenadas do Blender, portanto tem de ser
  // viradas aqui tambem: (x, y, z) -> (x, z, -y). Sem isto o mapa aparece de
  // pe, como uma parede, e demora a perceber porque.
  const por = (lista, x, y, z, rz, e) => {
    V.set(x, z, -y);
    R.set(0, rz, 0);
    Q.setFromEuler(R);
    E.set(e, e, e);
    M.compose(V, Q, E);
    for (const im of lista) im.setMatrixAt(im.count++, M);
  };

  for (const c of MAPA.copias) {
    const l = inst[c.peca]; if (!l) continue;
    por(l, c.p[0], c.p[1], c.p[2], c.rz, c.e);
    nInst++;
  }
  for (const m of MAPA.manchas) {
    for (const t of MAPA.arranjos[m.b]) {
      const l = inst[t.peca]; if (!l) continue;
      // `m.z` e a altura do terreno naquele ponto: sem ela a mata ficava toda
      // ao nivel do mar e metade dela desaparecia dentro das serras.
      por(l, m.p[0] + t.p[0] * m.e, m.p[1] + t.p[1] * m.e, (m.z || 0) + t.p[2] * m.e,
          t.rz, t.e * m.e);
      nInst++;
    }
  }
  for (const l of Object.values(inst))
    for (const im of l) im.instanceMatrix.needsUpdate = true;

  // expostos de proposito: e assim que se confere de fora quantas pecas
  // chegaram, e que se leva a camara a um sitio exato sem a arrastar a mao.
  Object.assign(window, { inst, cam, ctrl, cena, rend, MAPA, THREE });
  // ═══ AS TROPAS EM MARCHA ═════════════════════════════════════════════
  // Isto ainda NAO e o jogo: e uma demonstracao de que a peca, a estrada e o
  // relevo ja concordam o suficiente para uma coluna andar de uma aldeia a
  // outra sem sair do caminho nem enterrar-se no chao. Quando o motor mandar,
  // troca-se a fonte das colunas e o resto fica igual.
  //
  // A COLUNA ANDA EM FILA, com os homens espacados e a passo constante. Duas
  // coisas fazem-na parecer uma coluna e nao uma fila de bonecos: cada um sai
  // um pouco para o lado (nao ha estrada tao estreita que se ande em fila
  // indiana), e a velocidade e a do TIPO -- o cavaleiro anda o dobro do
  // lanceiro, que e a regra do proprio motor.
  const VEL = { lanceiro: 5.5, arqueiro: 7.0, cavaleiro: 11.0 };  // m/s
  const colunas = [];
  if (MAPA.estradas && MAPA.tropas) {
    let semente = 7;
    const sorte = () => (semente = (semente * 1103515245 + 12345) & 0x7fffffff)
                        / 0x7fffffff;
    for (const e of MAPA.estradas) {
      if (sorte() > 0.55) continue;                 // nem toda a estrada tem tropa
      const tipo = MAPA.tropas[Math.floor(sorte() * MAPA.tropas.length)];
      // vem do BANCO e nao de `inst`: uma tropa nao esta em `copias` -- nao ha
      // nenhuma colocada no mapa, porque quem as coloca e o jogo, a cada turno.
      if (!banco[tipo]) continue;
      const n = 3 + Math.floor(sorte() * 6);
      // o comprimento do caminho, para a marcha ser a passo e nao por troco
      const pts = e.pts, acum = [0];
      for (let i = 1; i < pts.length; i++)
        acum.push(acum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0],
                                           pts[i][1] - pts[i - 1][1]));
      colunas.push({ tipo, pts, acum, comp: acum[acum.length - 1], n,
                     t0: sorte() * 400, sentido: sorte() < 0.5 ? 1 : -1,
                     lado: () => 0 });
    }
  }
  // uma so lista de instancias por tipo, partilhada por todas as colunas
  const tropaInst = {};
  for (const tipo of (MAPA.tropas || [])) {
    if (!banco[tipo]) continue;
    const total = colunas.filter((c) => c.tipo === tipo)
                         .reduce((a, c) => a + c.n, 0);
    if (!total) continue;
    tropaInst[tipo] = banco[tipo].map((base) => {
      const im = new THREE.InstancedMesh(base.geometry, base.material, total);
      im.castShadow = true; im.receiveShadow = true; im.frustumCulled = false;
      im.count = total;
      cena.add(im);
      return im;
    });
  }
  window.__tropas = { colunas, tropaInst, VEL };

  // ═══ AS BANDEIRAS ════════════════════════════════════════════════════
  // A unica coisa da aldeia que muda quando ela troca de dono. Por isso nao e
  // assada: o forno grava ONDE fica o mastro e a cor e de quem for dono --
  // 22 aldeias vezes N Reis seriam N vezes mais renders, e um setimo Rei
  // custaria outro forno inteiro. Assim custa zero.
  //
  // O PANO ONDULA NO SHADER, e nao no laco de desenho. Sessenta bandeiras a
  // recalcular vertices em JavaScript sessenta vezes por segundo seriam 60x60
  // multiplicacoes por quadro por nada: a placa faz isto de graca, e cada
  // bandeira ondula com a fase da sua posicao, para nao baterem todas ao mesmo
  // tempo como um coro.
  const REIS = [0xc23b2e, 0x2f6fb5];        // vermelho e azul, por agora
  const mastroG = new THREE.CylinderGeometry(0.22, 0.26, 1, 6);
  const panoG = new THREE.PlaneGeometry(1, 1, 12, 1);
  panoG.translate(0.5, 0, 0);               // ancorado na tralha, nao no meio
  const mastros = [];
  for (const [cid, lista] of Object.entries(MAPA.mastros || {}))
    for (const m of lista) mastros.push({ cid, p: m });
  if (mastros.length) {
    const matMastro = new THREE.MeshStandardMaterial({ color: 0x3a2a18,
                                                       roughness: 0.9 });
    const imM = new THREE.InstancedMesh(mastroG, matMastro, mastros.length);
    imM.castShadow = true;
    cena.add(imM);
    const M2 = new THREE.Matrix4(), V2 = new THREE.Vector3();
    const Q2 = new THREE.Quaternion(), S2 = new THREE.Vector3();
    const ALT = 9.0;                        // altura do mastro, em metros
    mastros.forEach((m, i) => {
      V2.set(m.p[0], m.p[2] + ALT / 2, -m.p[1]);
      S2.set(1, ALT, 1);
      M2.compose(V2, Q2, S2);
      imM.setMatrixAt(i, M2);
    });
    imM.instanceMatrix.needsUpdate = true;

    // um pano por Rei, para a cor vir do material e nao de um atributo
    window.__bandeiras = [];
    for (let rei = 0; rei < REIS.length; rei++) {
      const desses = mastros.filter((_, i) => i % REIS.length === rei);
      if (!desses.length) continue;
      const mat = new THREE.MeshStandardMaterial({
        color: REIS[rei], roughness: 0.85, side: THREE.DoubleSide });
      mat.onBeforeCompile = (sh) => {
        sh.uniforms.tempo = { value: 0 };
        mat.userData.sh = sh;
        // escrito em template literal, com quebras de linha a serio: o GLSL
        // precisa delas, e uma barra-n escapada ja se perdeu duas vezes entre
        // o gerador e o ficheiro (uma delas dentro deste proprio comentario).
        sh.vertexShader = `uniform float tempo;
` + sh.vertexShader.replace("#include <begin_vertex>", `#include <begin_vertex>
float fase = float(gl_InstanceID) * 1.7;
float onda = sin(transformed.x * 5.0 - tempo * 7.0 + fase);
transformed.z += onda * transformed.x * 0.16;
transformed.y += onda * transformed.x * 0.05;`);
      };
      const im = new THREE.InstancedMesh(panoG, mat, desses.length);
      im.castShadow = true;
      im.frustumCulled = false;
      cena.add(im);
      desses.forEach((m, i) => {
        const larg = 3.4, alt = 2.2;
        V2.set(m.p[0], m.p[2] + ALT - alt * 0.75, -m.p[1]);
        Q2.setFromEuler(new THREE.Euler(0, (i * 2.3) % 6.28, 0));
        S2.set(larg, alt, 1);
        M2.compose(V2, Q2, S2);
        im.setMatrixAt(i, M2);
      });
      im.instanceMatrix.needsUpdate = true;
      window.__bandeiras.push(mat);
    }
  }

  window.__inst = inst;
  window.__mata = new Set(MAPA.arranjos.flat().map((t) => t.peca));
  const el = document.getElementById("carga");
  if (el) el.remove();
});

const liga = (id, fn) => { const e = document.getElementById(id);
                           e.onchange = () => fn(e.checked); };
liga("sombras", (v) => { rend.shadowMap.enabled = v;
  cena.traverse((o) => { if (o.material) o.material.needsUpdate = true; }); });
liga("mata", (v) => {
  for (const [n, l] of Object.entries(window.__inst || {}))
    if (window.__mata.has(n)) for (const im of l) im.visible = v;
});
liga("parar", (v) => { parado = v; });
liga("tropas", (v) => {
  mostrarTropas = v;
  for (const l of Object.values((window.__tropas || {}).tropaInst || {}))
    for (const im of l) im.visible = v;
});
liga("alto", (v) => {
  if (v) { cam.position.set(0, LY * 1.15, LY * 0.35); ctrl.target.set(0, 0, 0); }
});

function tamanho() {
  rend.setSize(innerWidth, innerHeight, false);
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
}
addEventListener("resize", tamanho); tamanho();

let quadros = 0;
const med = document.getElementById("med");
// ── mover as colunas ──────────────────────────────────────────────────────
// Um ponto no caminho, dado o metro andado. Interpola entre os dois vertices
// do eixo, portanto a tropa segue as curvas da estrada e sobe com o relevo --
// as duas coisas de graca, porque o eixo ja foi gravado com a altura la dentro.
const _p = new THREE.Vector3(), _q = new THREE.Quaternion();
const _e = new THREE.Euler(), _s = new THREE.Vector3(1, 1, 1);
const _m = new THREE.Matrix4();
function noCaminho(col, metros, saida) {
  const { pts, acum } = col;
  const d = Math.max(0, Math.min(col.comp - 0.01, metros));
  let i = 1;
  while (i < acum.length - 1 && acum[i] < d) i++;
  const t = (d - acum[i - 1]) / Math.max(acum[i] - acum[i - 1], 1e-6);
  const a = pts[i - 1], b = pts[i];
  saida.set(a[0] + (b[0] - a[0]) * t, a[2] + (b[2] - a[2]) * t,
            -(a[1] + (b[1] - a[1]) * t));
  return Math.atan2(-(b[1] - a[1]), b[0] - a[0]);   // rumo, ja em Y-para-cima
}

let mostrarTropas = true;
// O RELOGIO E DA PAGINA, e nao o do sistema. Parece um detalhe e nao e: com
// um relogio proprio, "parar o tempo" e uma linha, e conferir uma posicao
// deixa de ser uma corrida contra o proximo quadro.
let relogio = 0, parado = false, ultimo = performance.now();
function marchar(agora) {
  const T = window.__tropas;
  if (!T || !mostrarTropas) return;
  const contas = {};
  for (const col of T.colunas) {
    const lista = T.tropaInst[col.tipo];
    if (!lista) continue;
    const k = (contas[col.tipo] = contas[col.tipo] || { i: 0 });
    const vel = T.VEL[col.tipo] || 6;
    for (let j = 0; j < col.n; j++) {
      // vai e vem: chegado ao fim, a coluna volta. Nao e o jogo -- e so para
      // haver sempre movimento no mapa enquanto se olha para ele.
      const bruto = (agora * 0.001 * vel + col.t0 - j * 7.0);
      const volta = col.comp * 2;
      let d = ((bruto % volta) + volta) % volta;
      let sentido = 1;
      if (d > col.comp) { d = volta - d; sentido = -1; }
      const rumo = noCaminho(col, d, _p) + (sentido < 0 ? Math.PI : 0);
      // afastado do eixo, alternando de lado: uma coluna nao anda em fila
      const lat = ((j % 2) * 2 - 1) * 2.6;
      _p.x += Math.cos(rumo + Math.PI / 2) * lat;
      _p.z += Math.sin(rumo + Math.PI / 2) * lat;
      // o balanco do passo: meio metro para cima e para baixo, desfasado por
      // homem. E o que separa "tropas a andar" de "tropas a deslizar".
      _p.y += Math.abs(Math.sin(agora * 0.006 * vel + j * 1.7)) * 0.22;
      _e.set(0, -rumo, 0);
      _q.setFromEuler(_e);
      _m.compose(_p, _q, _s);
      for (const im of lista) im.setMatrixAt(k.i, _m);
      k.i++;
    }
  }
  for (const lista of Object.values(T.tropaInst))
    for (const im of lista) im.instanceMatrix.needsUpdate = true;
}

function laco() {
  requestAnimationFrame(laco);
  quadros++;
  const agora = performance.now();
  // o passo e LIMITADO a 100 ms: quando a pagina fica escondida o navegador
  // estrangula o requestAnimationFrame, e sem este teto as tropas
  // teleportavam-se meio mapa ao voltar
  if (!parado) relogio += Math.min(agora - ultimo, 100);
  ultimo = agora;
  marchar(relogio);
  for (const mat of (window.__bandeiras || []))
    if (mat.userData.sh) mat.userData.sh.uniforms.tempo.value = relogio * 0.001;
  ctrl.update();
  // A SOMBRA SEGUE A CAMARA, e nao o mapa. Um mapa de sombra unico a cobrir
  // 2,8 km daria menos de um pixel por metro e as sombras sairiam em degraus.
  // Assim, a caixa aperta-se ao que se esta a ver: resolucao onde estao os
  // olhos, e o resto do mapa nao paga por isso.
  const RS = Math.min(Math.max(ctrl.getDistance() * 0.75, 60), 700);
  sol.target.position.copy(ctrl.target);
  sol.position.copy(ctrl.target).add(
    new THREE.Vector3(-d[0], -d[1], -d[2]).multiplyScalar(RS * 2.2));
  const c = sol.shadow.camera;
  c.left = -RS; c.right = RS; c.top = RS; c.bottom = -RS;
  c.near = 1; c.far = RS * 5; c.updateProjectionMatrix();
  rend.render(cena, cam);
}
setInterval(() => {
  const alt = Math.round(90 - THREE.MathUtils.radToDeg(
    Math.acos(cam.position.clone().sub(ctrl.target).normalize().y)));
  med.innerHTML = "<b>" + quadros * 2 + "</b> fps<br>"
    + nInst.toLocaleString("pt") + " pecas &middot; "
    + (nTri / 1e6).toFixed(1) + "M triangulos<br>"
    + "camara a " + alt + "&deg; &middot; " + Math.round(ctrl.getDistance()) + " m<br>"
    + "ilha de " + (LX / 1000).toFixed(1) + " x " + (LY / 1000).toFixed(1) + " km";
  quadros = 0;
}, 500);
laco();
</script>
