<!doctype html>
<meta charset="utf-8">
<title>A Iberia em 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1418; color: #e8dcc0;
               font: 13px system-ui, sans-serif; overflow: hidden; }
  #palco { position: fixed; inset: 0; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 5; width: 250px;
         background: rgba(20,15,8,.88); border: 1px solid #6b5836;
         border-radius: 8px; padding: 10px 12px; }
  #hud h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: .06em; }
  #hud label { display: flex; align-items: center; gap: 7px; margin: 5px 0; }
  #hud p { color: #cbbd94; font-style: italic; line-height: 1.45; margin: 8px 0 0; }
  #med { position: fixed; top: 12px; right: 12px; z-index: 5; text-align: right;
         background: rgba(20,15,8,.88); border: 1px solid #6b5836;
         border-radius: 8px; padding: 9px 12px; font-variant-numeric: tabular-nums; }
  #med b { color: #f0d9a0; font-size: 17px; }
  #carga { position: fixed; inset: 0; display: flex; align-items: center;
           justify-content: center; background: #0d1418; z-index: 9;
           font-size: 15px; color: #cbbd94; }
</style>
<div id="palco"></div>
<div id="carga">a montar a Iberia...</div>
<div id="hud">
  <h1>A IBERIA EM 3D</h1>
  <label><input type="checkbox" id="sombras" checked> sombras</label>
  <label><input type="checkbox" id="nomes" checked> nomes das aldeias</label>
  <label><input type="checkbox" id="parar"> parar o tempo</label>
  <label><input type="checkbox" id="alto"> vista de cima</label>
  <p>Arrasta para girar &middot; roda para aproximar &middot; botao direito
     para deslocar. Desce ate ao chao e passeia entre as aldeias.</p>
</div>
<div id="med"></div>

<script type="module">
// Esta pagina e so a MONTRA do modulo: nao sabe desenhar nada. Serve para ver
// o mapa sem o jogo por cima -- e serve de prova de que o modulo corre
// sozinho, que e a garantia de que o jogo nao vai herdar dependencias
// escondidas quando o carregar.
import { iniciar } from "./mapa3d.js";

const mapa = await iniciar(document.getElementById("palco"));
Object.assign(window, { mapa, cena: mapa.cena, cam: mapa.cam, ctrl: mapa.ctrl,
                        MAPA: mapa.MAPA, THREE: mapa.THREE, rend: mapa.rend });
document.getElementById("carga").remove();

const liga = (id, fn) => { const e = document.getElementById(id);
                           e.onchange = () => fn(e.checked); };
liga("sombras", (v) => { mapa.rend.shadowMap.enabled = v;
  mapa.cena.traverse((o) => { if (o.material) o.material.needsUpdate = true; }); });
liga("nomes", (v) => { mapa.cena.traverse((o) => { if (o.isSprite) o.visible = v; }); });
liga("parar", (v) => mapa.parar(v));
liga("alto", (v) => {
  if (!v) return;
  const [, LY] = mapa.MAPA.mapa_m;
  mapa.cam.position.set(0, LY * 1.15, LY * 0.35);
  mapa.ctrl.target.set(0, 0, 0);
});

const med = document.getElementById("med");
const [LX, LY] = mapa.MAPA.mapa_m;
setInterval(() => {
  const alt = Math.round(90 - mapa.THREE.MathUtils.radToDeg(
    Math.acos(mapa.cam.position.clone().sub(mapa.ctrl.target).normalize().y)));
  med.innerHTML = "<b>" + mapa.fps + "</b> fps<br>"
    + mapa.pecas.toLocaleString("pt") + " pecas &middot; "
    + (mapa.triangulos / 1e6).toFixed(1) + "M triangulos<br>"
    + "camara a " + alt + "&deg; &middot; " + Math.round(mapa.ctrl.getDistance()) + " m<br>"
    + "ilha de " + (LX / 1000).toFixed(1) + " x " + (LY / 1000).toFixed(1) + " km";
}, 500);
</script>
