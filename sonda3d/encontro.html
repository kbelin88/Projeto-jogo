<!doctype html>
<meta charset="utf-8">
<title>O encontro na estrada</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1418; color: #e8dcc0;
               font: 13px system-ui, sans-serif; overflow: hidden; }
  #palco { position: fixed; inset: 0; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 5; width: 300px;
         background: rgba(20,15,8,.92); border: 1px solid #6b5836;
         border-radius: 8px; padding: 11px 13px; }
  #hud h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: .06em; }
  #hud p { color: #cbbd94; line-height: 1.5; margin: 7px 0 0; }
  #hud b { color: #f0d9a0; }
  #hud button { background: #3a2e18; color: #e8dcc0; border: 1px solid #6b5836;
                border-radius: 5px; padding: 5px 9px; margin: 4px 4px 0 0;
                cursor: pointer; font: inherit; }
  #hud button:hover { background: #55401f; }
  #med { position: fixed; top: 12px; right: 12px; z-index: 5; text-align: right;
         background: rgba(20,15,8,.92); border: 1px solid #6b5836;
         border-radius: 8px; padding: 9px 12px; font-variant-numeric: tabular-nums; }
  #med b { color: #f0d9a0; font-size: 16px; }
  #carga { position: fixed; inset: 0; display: flex; align-items: center;
           justify-content: center; background: #0d1418; z-index: 9; color: #cbbd94; }
</style>
<div id="palco"></div>
<div id="carga">a montar o encontro...</div>
<div id="hud">
  <h1>O ENCONTRO NA ESTRADA</h1>
  <p>Duas colunas descem a mesma estrada e encontram-se a meio. A marcha e a
     batalha são as <b>do jogo</b> — esta página só as põe a correr sem partida.</p>
  <div>
    <button data-c="ver">ver o encontro</button>
    <button data-c="lado">ver de lado</button>
    <button data-c="alto">ver de cima</button>
    <button data-c="outra">outra vez</button>
  </div>
  <p id="estado">&nbsp;</p>
</div>
<div id="med"></div>

<script type="module">
// ── A BANCADA DA BATALHA ────────────────────────────────────────────────────
// Até 22/09 esta página tinha o guião da batalha escrito OUTRA VEZ: 841 linhas
// com formação, flechas, golpes, tombos e debandada — um segundo desenho, ao
// lado do `batalha.js` que corre no jogo. Afinava-se um e o outro ficava para
// trás: a debandada (que o motor não tem) viveu aqui dias depois de a cena do
// jogo já aniquilar o perdedor.
//
// Agora a página não sabe lutar. Ela move duas marchas pelo `mapa3d` e, quando
// se encontram, manda o MESMO evento que o motor manda (`combate_estrada`). O
// que se vê aqui é, linha por linha, o que se vê numa partida.
import { iniciar } from "./mapa3d.js";

const NA_BANCADA = new URLSearchParams(location.search).get("mapa") === "bancada";
const mapa = await iniciar(document.getElementById("palco"),
  NA_BANCADA ? { cena: "bancada" } : {});
const { MAPA, THREE, cam, ctrl } = mapa;
Object.assign(window, { mapa, MAPA, THREE, cam, ctrl });
document.getElementById("carga").remove();
const estado = document.getElementById("estado");

// a estrada: Madrid–Toledo no mapa do jogo, a única da bancada
const via = NA_BANCADA ? MAPA.estradas[0]
  : (MAPA.estradas.find((e) => (e.de === "madrid" && e.para === "toledo")
                            || (e.de === "toledo" && e.para === "madrid"))
     || MAPA.estradas[0]);

// as duas hostes, com composição de verdade
const HOSTE = {
  A: { lanceiro: 24, arqueiro: 12, cavaleiro: 6 },
  B: { lanceiro: 18, arqueiro: 10, cavaleiro: 4 },
};
const soma = (o) => o.lanceiro + o.arqueiro + o.cavaleiro;
const T_ENCONTRO = 0.5;          // onde se encontram, ao longo do troço
const PASSO_T = 0.05;            // ~10 s de marcha até ao choque

let t = 0, lutou = false, fim = 0, depois = 0;

// ⚠ DEPOIS DO CHOQUE SO HA UMA COLUNA. No motor o perdedor e ANIQUILADO: a
// marcha dele deixa de existir no estado, e o vencedor segue caminho com menos
// homens. A bancada tem de mentir o menos possivel, senao volta a ensinar-nos
// uma batalha que o jogo nao tem.
function marchas() {
  if (lutou) {
    const resta = { lanceiro: 17, arqueiro: 10, cavaleiro: 6 };   // 42 - 9 baixas
    return [{ de: via.de, para: via.para, t: Math.min(0.98, T_ENCONTRO + depois),
              dono: "A", tipo: "lanceiro", composicao: resta, tropas: soma(resta) }];
  }
  const avanco = T_ENCONTRO * t;
  return [
    { de: via.de, para: via.para, t: avanco,
      dono: "A", tipo: "lanceiro", composicao: HOSTE.A, tropas: soma(HOSTE.A) },
    { de: via.para, para: via.de, t: avanco,
      dono: "B", tipo: "lanceiro", composicao: HOSTE.B, tropas: soma(HOSTE.B) },
  ];
}

// o evento é o do motor: o perdedor sai inteiro, o vencedor perde uma fração
function eventoDoChoque() {
  return {
    tipo: "combate_estrada", turno: 1, id: "bancada|" + Date.now(),
    de: via.de, para: via.para, t: T_ENCONTRO,
    vencedor: "A", perdedor: "B",
    compVenc: HOSTE.A, compPerd: HOSTE.B,
    totalVenc: soma(HOSTE.A), baixasVenc: 9, segundos: 9,
  };
}

function passo(dt) {
  if (!lutou) {
    t = Math.min(1, t + dt * PASSO_T / T_ENCONTRO);
    mapa.atualizar({ turno: 1, aldeias: [], marchas: marchas() });
    if (t >= 1) {
      lutou = true;
      mapa.atualizar({ turno: 1, aldeias: [], marchas: marchas(),
                       eventos: [eventoDoChoque()] });
      estado.innerHTML = "Encontraram-se. O Rei <b>A</b> vence; o Rei <b>B</b> "
        + "perde o exército inteiro — como o motor resolve.";
    }
  } else {
    depois += dt * PASSO_T;                       // o vencedor segue caminho
    mapa.atualizar({ turno: 1, aldeias: [], marchas: marchas() });
    if (!mapa.batalhas.length && (fim += dt) > 3) recomecar();
  }
}

function recomecar() {
  t = 0; lutou = false; fim = 0; depois = 0;
  estado.innerHTML = "As duas colunas descem a estrada.";
  mapa.atualizar({ turno: 1, aldeias: [], marchas: marchas() });
}

// ── A CÂMARA ────────────────────────────────────────────────────────────────
function pontoDoChoque() {
  const pts = via.pts;
  const q = pts[Math.floor(pts.length * T_ENCONTRO)];
  return new THREE.Vector3(q[0], q[2], -q[1]);
}
function olhar(de, alto, dist) {
  const p = pontoDoChoque();
  ctrl.target.copy(p).add(new THREE.Vector3(0, 3, 0));
  cam.position.set(p.x + Math.cos(de) * dist, p.y + alto, p.z + Math.sin(de) * dist);
  ctrl.update();
}
for (const b of document.querySelectorAll("#hud button")) {
  b.onclick = () => {
    const c = b.dataset.c;
    if (c === "outra") { recomecar(); return; }
    if (c === "ver") olhar(0.9, 26, 48);
    if (c === "lado") olhar(0.0, 12, 56);
    if (c === "alto") olhar(0.0, 95, 45);
  };
}

recomecar();
olhar(0.9, 26, 48);

let ultimo = performance.now();
(function laco() {
  requestAnimationFrame(laco);
  const agora = performance.now();
  const dt = Math.min((agora - ultimo) / 1000, 0.1);
  ultimo = agora;
  passo(dt);
})();
// um passo fixo, para gravar vídeo como se grava o mapa
window.avancar = (dt) => { passo(dt / 1000); mapa.avancar(dt); };

const med = document.getElementById("med");
setInterval(() => {
  const bs = mapa.batalhas;
  const d = mapa.diagnostico;
  med.innerHTML = "<b>" + mapa.fps + "</b> fps<br>"
    + d.figurasAnimadas + " figuras na marcha<br>"
    + bs.length + " cena(s) de batalha"
    + (bs[0] ? "<br>caidos: " + (bs[0].figuras - bs[0].dePe) : "");
}, 500);
</script>
