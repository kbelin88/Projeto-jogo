<!doctype html>
<meta charset="utf-8">
<title>O encontro na estrada</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1418; color: #e8dcc0;
               font: 13px system-ui, sans-serif; overflow: hidden; }
  #palco { position: fixed; inset: 0; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 5; width: 320px;
         background: rgba(20,15,8,.92); border: 1px solid #6b5836;
         border-radius: 8px; padding: 11px 13px; }
  #hud h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: .06em; }
  #hud p { color: #cbbd94; line-height: 1.5; margin: 7px 0 0; }
  #hud b { color: #f0d9a0; }
  #hud button { background: #3a2e18; color: #e8dcc0; border: 1px solid #6b5836;
                border-radius: 5px; padding: 5px 9px; margin: 4px 4px 0 0;
                cursor: pointer; font: inherit; }
  #hud button:hover { background: #55401f; }
  #med { position: fixed; top: 12px; right: 12px; z-index: 5; text-align: right;
         background: rgba(20,15,8,.92); border: 1px solid #6b5836;
         border-radius: 8px; padding: 9px 12px; font-variant-numeric: tabular-nums; }
  #med b { color: #f0d9a0; font-size: 16px; }
  #carga { position: fixed; inset: 0; display: flex; align-items: center;
           justify-content: center; background: #0d1418; z-index: 9; color: #cbbd94; }
</style>
<div id="palco"></div>
<div id="carga">a montar o encontro...</div>
<div id="hud">
  <h1>O ENCONTRO NA ESTRADA</h1>
  <p>A estrada entre <b>Madrid</b> e <b>Toledo</b> tem <b id="np">?</b> postos.
     Duas colunas avançam de posto em posto e param no mesmo — que é onde a
     batalha há de acontecer.</p>
  <div>
    <button data-c="ver">ver o encontro</button>
    <button data-c="lado">ver de lado</button>
    <button data-c="alto">ver de cima</button>
    <button data-c="outra">outra vez</button>
  </div>
  <p id="estado">&nbsp;</p>
</div>
<div id="med"></div>

<script type="module">
import { iniciar, COR_REI } from "./mapa3d.js";
import * as THREE from "./vendor/three.module.js";
import { GLTFLoader } from "./vendor/loaders/GLTFLoader.js";
import { clone as clonarComOssos } from "./vendor/utils/SkeletonUtils.js";
import { mergeGeometries } from "./vendor/utils/BufferGeometryUtils.js";

const mapa = await iniciar(document.getElementById("palco"));
const { cena, cam, ctrl, MAPA } = mapa;
Object.assign(window, { mapa, cena, cam, ctrl, MAPA, THREE });
mapa.atualizar({ turno: 0, aldeias: [], marchas: [] });   // as tropas são estas

// ── A ESTRADA COM POSTOS ────────────────────────────────────────────────────
// ── PORQUE É QUE A ESTRADA PRECISA DE POSTOS ────────────────────────────────
// Duas colunas em rota de colisão numa linha contínua ou se atravessam ou
// param num sítio arbitrário, e as duas coisas leem-se mal. Com postos, o
// encontro é uma condição EXATA — mesmo posto, sentidos opostos — e acontece
// num LUGAR, que é o que a câmara precisa para haver cena.
//
// Os postos são repartidos por FRAÇÃO da estrada e não por metros, porque o
// que tem de ser igual entre os dois lados é o TEMPO: dois exércitos à mesma
// velocidade, um de cada ponta, hão de encontrar-se num posto e não entre dois.
const via = MAPA.estradas.find((e) => (e.de === "madrid" && e.para === "toledo")
                                   || (e.de === "toledo" && e.para === "madrid"));
const pts = via.pts;
const acum = [0];
for (let i = 1; i < pts.length; i++)
  acum.push(acum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
const COMP = acum[acum.length - 1];

const _p = new THREE.Vector3();
function noCaminho(metros, saida) {
  const d = Math.max(0, Math.min(COMP - 0.01, metros));
  let i = 1;
  while (i < acum.length - 1 && acum[i] < d) i++;
  const t = (d - acum[i - 1]) / Math.max(acum[i] - acum[i - 1], 1e-6);
  const a = pts[i - 1], b = pts[i];
  saida.set(a[0] + (b[0] - a[0]) * t, a[2] + (b[2] - a[2]) * t,
            -(a[1] + (b[1] - a[1]) * t));
  return Math.atan2(-(b[1] - a[1]), b[0] - a[0]);
}

const N_POSTOS = 7;                       // ímpar: há um posto no MEIO da estrada
const postos = [];
for (let i = 0; i < N_POSTOS; i++) {
  const m = COMP * (i + 0.5) / N_POSTOS;
  const v = new THREE.Vector3();
  const rumo = noCaminho(m, v);
  postos.push({ m, v: v.clone(), rumo });
}
document.getElementById("np").textContent = N_POSTOS;

// o marco: um prumo de pedra à beira da estrada. Faz duas coisas — diz onde é
// um posto, e faz uma estrada LER-SE COMO UMA SÓ, que é o defeito de que o
// Lucas se queixa há meses (duas estradas a passar a vinte metros uma da outra
// parecem a mesma, e dois exércitos em estradas diferentes parecem atravessar-se)
const geoMarco = new THREE.CylinderGeometry(0.55, 0.85, 3.2, 5);
const matMarco = new THREE.MeshStandardMaterial({ color: 0x9a9384, roughness: 0.95 });
const marcos = new THREE.InstancedMesh(geoMarco, matMarco, N_POSTOS);
marcos.castShadow = marcos.receiveShadow = true;
const _m4 = new THREE.Matrix4();
postos.forEach((p, i) => {
  const lado = new THREE.Vector3(Math.cos(p.rumo + Math.PI / 2), 0,
                                 Math.sin(p.rumo + Math.PI / 2)).multiplyScalar(7.5);
  _m4.makeTranslation(p.v.x + lado.x, p.v.y + 1.6, p.v.z + lado.z);
  marcos.setMatrixAt(i, _m4);
});
cena.add(marcos);

// ── AS DUAS COLUNAS ─────────────────────────────────────────────────────────
// ── E PORQUE É QUE ELAS TÊM DE TER COR DE REI ───────────────────────────────
// Até aqui as tropas distinguiam-se por TIPO: ocre o lanceiro, verde o
// arqueiro, vermelho o cavaleiro. Num encontro isso não chega — o que se tem
// de ler primeiro é DE QUEM SÃO, e só depois o que são. A túnica passa a levar
// a cor do Rei; a silhueta continua a dizer o tipo.
//
// `clonarComOssos` partilha os materiais entre as cópias, portanto pintar um
// pintava a coluna inimiga também: o material tem de ser clonado por lado.
const glb = {};
for (const tipo of ["lanceiro", "arqueiro", "cavaleiro"])
  glb[tipo] = await new Promise((ok, mal) =>
    new GLTFLoader().load("./" + tipo + ".glb", ok, undefined, mal));

const PASSO = { lanceiro: /idle_walk/i, arqueiro: /idle_walk/i, cavaleiro: /^gallop$/i };
const PARADO = { lanceiro: /alerted_stand/i, arqueiro: /alerted_stand/i,
                 cavaleiro: /^idle$/i };
const GOLPE = { lanceiro: /hit_spear/i, arqueiro: /hit_spear/i,
                cavaleiro: /^gallop$/i };
const TUNICA = { A: 0x35557f, B: 0x8e3a2c };

function figura(tipo, rei) {
  const g = glb[tipo];
  const raiz = clonarComOssos(g.scene);
  raiz.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = o.receiveShadow = true;
    o.frustumCulled = false;
    if (o.material && o.material.name === "M_armor_clothe") {
      o.material = o.material.clone();
      o.material.color.setHex(TUNICA[rei]);
    }
  });
  raiz.scale.setScalar(2.2);
  const mix = new THREE.AnimationMixer(raiz);
  const dos = {};
  for (const [nome, padrao] of [["andar", PASSO[tipo]], ["parar", PARADO[tipo]],
                                ["bater", GOLPE[tipo]]]) {
    const cl = g.animations.find((a) => padrao.test(a.name))
      || g.animations.find((a) => /walk/i.test(a.name)) || g.animations[0];
    dos[nome] = mix.clipAction(cl);
  }
  // o golpe é UMA vez e volta à guarda; se fosse em ciclo o homem ficava a
  // esfaquear o ar depois de o inimigo já ter caído
  dos.bater.setLoop(THREE.LoopOnce, 1);
  dos.bater.clampWhenFinished = true;
  cena.add(raiz);
  return { raiz, mix, acao: dos, tipo, pose: null, avanco: 0, avancoAlvo: 0,
           golpe: dos.bater.getClip().duration };
}

// ── UMA POSE DE CADA VEZ ────────────────────────────────────────────────────
// Trocar de animação à mão em cinco sítios diferentes foi o que me deu, na
// primeira tentativa, um morto a continuar em guarda enquanto tombava. Passa
// tudo por aqui, e quem já está na pose pedida não faz nada.
function pose(h, nome) {
  if (h.pose === nome || !h.acao[nome]) return;
  if (h.acao[h.pose]) h.acao[h.pose].fadeOut(0.2);
  h.acao[nome].reset().fadeIn(0.2).play();
  h.pose = nome;
}

// a ORDEM é a coluna: quem o Rei põe à frente vai à frente, e vê-se
const HOSTE = {
  A: ["lanceiro", "lanceiro", "lanceiro", "arqueiro", "arqueiro"],
  B: ["lanceiro", "lanceiro", "arqueiro", "arqueiro", "cavaleiro"],
};
const exercitos = {};
for (const rei of ["A", "B"]) {
  const homens = HOSTE[rei].map((t, i) => {
    const f = figura(t, rei);
    f.fila = i;
    pose(f, "andar");
    f.acao.andar.time = (i * 0.41) % f.acao.andar.getClip().duration;
    return f;
  });
  exercitos[rei] = {
    homens,
    posto: rei === "A" ? -1 : N_POSTOS,      // fora da estrada, a entrar
    sentido: rei === "A" ? 1 : -1,
    prog: 0,                                  // 0..1 entre o posto e o seguinte
  };
}

// ── A SALVA ─────────────────────────────────────────────────────────────────
// ── PORQUE É QUE ISTO É BARATO ──────────────────────────────────────────────
// O motor resolve o combate por números: quando a cena começa, o resultado JÁ
// ESTÁ DECIDIDO. Não há física, não há deteção de acertos, não há IA nenhuma —
// há um GUIÃO. Cada flecha sabe em quem vai acertar antes de sair da corda, e
// cada queda tem hora marcada.
//
// É a diferença entre ENCENAR um resultado, que é código, e SIMULAR uma
// batalha, que é impossível com o que temos. E é como os antigos o faziam,
// não por esperteza: por não terem outra hipótese.
const N_FLECHAS = 140;
// EXAGERADA, e de propósito. Uma flecha à escala destes homens tem cinco
// centímetros de grossura e não se vê a trinta metros. O Age of Empires faz o
// mesmo: a flecha não é um objeto, é um SINAL de que há combate.
const _gh = new THREE.CylinderGeometry(0.055, 0.085, 2.4, 4);
const _gp = new THREE.ConeGeometry(0.16, 0.40, 4);
_gp.translate(0, 1.40, 0);
const _gf = new THREE.BoxGeometry(0.02, 0.42, 0.30);
_gf.translate(0, -1.00, 0);
const flechas = new THREE.InstancedMesh(
  mergeGeometries([_gh, _gp, _gf]),
  new THREE.MeshStandardMaterial({ color: 0x6d5738, roughness: 0.92 }), N_FLECHAS);
flechas.castShadow = true;
flechas.frustumCulled = false;
flechas.count = 0;
cena.add(flechas);

// gravidade exagerada, e de propósito: as figuras estão a 2,2x, e com os 9,8
// do mundo real a flecha fazia um arco de bala perdida em vez de um arco de
// arco. O que se quer é que se VEJA subir e cair.
const GRAV = -30;
const voo = [];
const _o3 = new THREE.Vector3(), _d3 = new THREE.Vector3();
const _q3 = new THREE.Quaternion(), _s3 = new THREE.Vector3(1, 1, 1);
const _m3 = new THREE.Matrix4(), _cima = new THREE.Vector3(0, 1, 0);

function lancar(origem, destino, vitima) {
  const dist = origem.distanceTo(destino);
  // ── O ARCO TEM DE SER ALTO ──────────────────────────────────────────────
  // Com um tempo de voo curto a flecha vai quase a direito, chega deitada e
  // fica no chão como um pau caído. O que se lê como salva é a subida: as
  // flechas contra o céu e a queda a pique. Portanto o tempo de voo é
  // ESCOLHIDO alto, e a velocidade sai da conta -- não o contrário.
  const tv = 0.8 + dist / 32;
  const v = destino.clone().sub(origem).divideScalar(tv);
  v.y -= 0.5 * GRAV * tv;              // a conta do tiro: v = (D-O)/t - ½gt
  voo.push({ o: origem.clone(), v, t: 0, tv, cravada: -1, vitima });
  if (voo.length > N_FLECHAS) voo.shift();
}

function moverFlechas(dt) {
  for (const f of voo) {
    if (f.cravada >= 0) { f.cravada += dt; continue; }
    f.t += dt;
    if (f.t >= f.tv) {
      f.t = f.tv;
      f.cravada = 0;
      // a queda acontece quando a FLECHA CHEGA, não quando é disparada: é o
      // que faz o espectador ligar as duas coisas
      if (f.vitima && !f.vitima.caido) tombar(f.vitima);
    }
  }
  // as cravadas ficam no chão um bocado: um campo a encher-se de flechas diz
  // "aqui houve uma batalha" melhor do que qualquer efeito
  while (voo.length && voo[0].cravada > 9) voo.shift();
  let n = 0;
  for (const f of voo) {
    const t = f.t;
    _o3.set(f.o.x + f.v.x * t, f.o.y + f.v.y * t + 0.5 * GRAV * t * t,
            f.o.z + f.v.z * t);
    _d3.set(f.v.x, f.v.y + GRAV * t, f.v.z).normalize();
    _q3.setFromUnitVectors(_cima, _d3);
    _m3.compose(_o3, _q3, _s3);
    flechas.setMatrixAt(n++, _m3);
  }
  flechas.count = n;
  flechas.instanceMatrix.needsUpdate = true;
}

function tombar(h) {
  h.caido = { t: 0 };
  for (const a of Object.values(h.acao)) a.fadeOut(0.15);
}

// ── O GUIÃO ─────────────────────────────────────────────────────────────────
// Escrito de uma vez, no instante em que as duas hostes travam. Depois só se
// toca. Quando houver motor, é ele que escreve isto — e a cena não muda nada.
const _mao = new THREE.Vector3();

// ── O PONTO QUE NUNCA SE VÊ FALHAR ──────────────────────────────────────────
// O glTF guarda os ossos como `hand.L`, e o carregador do three TIRA O PONTO ao
// montar a cena: lá dentro chamam-se `handL`. Procurar por `hand.L` devolve
// `undefined` — e `undefined` aqui não dá erro nenhum, dá uma flecha a sair dos
// pés do arqueiro e um braço que nunca puxa a corda. Duas coisas que eu tinha
// escrito e que nunca chegaram a acontecer.
function osso(raiz, nome) {
  return raiz.getObjectByName(nome) || raiz.getObjectByName(nome.replace(".", ""));
}
let guiao = null, tGuiao = 0, iGuiao = 0;

function montarGuiao() {
  const g = [];
  const lado = (rei) => exercitos[rei];
  const inimigo = (rei) => exercitos[rei === "A" ? "B" : "A"].homens;
  const dos = (rei, tipo) => lado(rei).homens.filter((h) => h.tipo === tipo);
  // três flechas por arqueiro em cada salva: uma flecha sozinha é um tiro,
  // três ao mesmo tempo são uma SALVA -- e é a salva que se lê de longe
  const POR_ARQUEIRO = 3;
  let t = 1.0;

  // ── A VAGA É A BATIDA DA CENA ─────────────────────────────────────────────
  // E não é invenção da animação: é a mecânica. Quando o Rei manda um ataque
  // composto, escolhe a ORDEM das tropas, e essa ordem é exatamente isto — os
  // arqueiros a abrir, os lanceiros a fechar, e assim por diante. Uma batalha
  // sem vagas é uma trapalhada sem forma; com vagas tem princípio, meio e fim
  // de graça, e cada tempo lê-se porque é um tipo contra outro.
  for (let vaga = 0; vaga < 4; vaga++) {
    // ── as flechas abrem ───────────────────────────────────────────────────
    for (const rei of ["A", "B"]) {
      dos(rei, "arqueiro").forEach((h, k) => {
        const q = t + k * 0.24;
        g.push({ t: q, faz: "puxar", quem: h });
        for (let f = 0; f < POR_ARQUEIRO; f++)
          g.push({ t: q + 0.70 + f * 0.13, faz: "atirar", quem: h,
                   deles: inimigo(rei), mata: f === 0 && k === 0 && vaga > 0 });
      });
    }
    t += 3.4;

    // ── e as lanças fecham ─────────────────────────────────────────────────
    for (const rei of ["A", "B"])
      g.push({ t, faz: "carregar", quem: dos(rei, "lanceiro"), quanto: 3.6 });
    t += 1.3;
    for (let k = 0; k < 3; k++) {
      for (const rei of ["A", "B"])
        dos(rei, "lanceiro").forEach((h, j) => {
          g.push({ t: t + k * 0.95 + j * 0.17, faz: "bater", quem: h,
                   deles: inimigo(rei), mata: k === 2 && j === 0 });
        });
    }
    t += 3.4;
    for (const rei of ["A", "B"])
      g.push({ t, faz: "carregar", quem: dos(rei, "lanceiro"), quanto: 0 });
    t += 2.2;
  }
  g.sort((a, b) => a.t - b.t);
  return g;
}

function tocarGuiao(dt) {
  tGuiao += dt;
  while (iGuiao < guiao.length && guiao[iGuiao].t <= tGuiao) {
    const ev = guiao[iGuiao++];
    if (ev.faz === "carregar") {
      for (const h of ev.quem) if (!h.caido) h.avancoAlvo = ev.quanto;
      continue;
    }
    if (ev.quem.caido) continue;
    if (ev.faz === "bater") {
      // o golpe e a queda são o MESMO instante: é isso que os liga aos olhos
      // de quem vê. Com meio segundo entre eles já parecem duas coisas.
      if (ev.quem.acao[ev.quem.pose]) ev.quem.acao[ev.quem.pose].fadeOut(0.12);
      ev.quem.acao.bater.reset().fadeIn(0.12).play();
      ev.quem.pose = "bater";
      const vivos = ev.deles.filter((h) => !h.caido && h.tipo === "lanceiro");
      if (ev.mata && vivos.length) tombar(vivos[0]);
      continue;
    }
    if (ev.faz === "puxar") { ev.quem.puxa = 0; continue; }
    ev.quem.puxa = null;
    const vivos = ev.deles.filter((h) => !h.caido);
    if (!vivos.length) continue;
    const alvo = vivos[Math.floor(Math.random() * vivos.length)];
    const arco = osso(ev.quem.raiz, "hand.L");
    (arco || ev.quem.raiz).getWorldPosition(_mao);
    _mao.y += 1.0;
    const d = alvo.raiz.position.clone();
    if (ev.mata) {
      d.y += 2.4;                       // ao peito: esta flecha tem nome
      lancar(_mao, d, alvo);
    } else {
      d.x += (Math.random() - 0.5) * 9;
      d.z += (Math.random() - 0.5) * 9;
      d.y += 0.1;                       // ao chão à volta dele
      lancar(_mao, d, null);
    }
  }
}

// ── O AVANÇO, DE POSTO EM POSTO ─────────────────────────────────────────────
const T_POSTO = 1.9;                         // segundos para vencer um posto
let travados = false, relogio = 0, disputado = (N_POSTOS - 1) >> 1;
const _euler = new THREE.Euler();
const _qPuxa = new THREE.Quaternion();
const _eixoPuxa = new THREE.Vector3(1, 0, 0);
const estado = document.getElementById("estado");

function ondeParam(e) {
  // o posto para onde este exército quer ir a seguir
  return e.posto + e.sentido;
}

function avancar(dt) {
  relogio += dt;
  const A = exercitos.A, B = exercitos.B;
  if (!travados) {
    // ── A CONDIÇÃO DE ENCONTRO ──────────────────────────────────────────
    // Não é distância, é POSTO. Ou pedem o mesmo posto, ou já se cruzaram —
    // as duas dizem a mesma coisa: daqui não passam. Medir por distância era
    // voltar ao problema de origem, em que dois exércitos a vinte metros um
    // do outro (em estradas diferentes!) pareciam estar a lutar.
    const proxA = ondeParam(A), proxB = ondeParam(B);
    if (proxA >= proxB) {
      travados = true;
      // ── E O POSTO DISPUTADO É O SÍTIO ───────────────────────────────
      // Parar cada um no seu posto deixava-os a oitenta metros de distância,
      // que no ecrã não é um confronto: é um desencontro. Os dois avançam
      // PARA o posto que ambos pediram e travam a poucos passos um do
      // outro. O lugar da batalha é o posto, não o meio-termo entre dois.
      disputado = proxA;
      for (const e of [A, B]) e.parada = disputado - e.sentido * 0.13;
      estado.innerHTML = "Travaram no posto <b>" + (disputado + 1) + "</b> de "
        + N_POSTOS + " &mdash; é aqui que a batalha acontece.";
    } else {
      for (const e of [A, B]) {
        e.prog += dt / T_POSTO;
        while (e.prog >= 1) { e.prog -= 1; e.posto += e.sentido; }
      }
    }
  } else {
    for (const e of [A, B]) {
      const onde = e.posto + e.sentido * e.prog;
      const falta = e.parada - onde;
      if (Math.abs(falta) > 0.012) {
        e.prog += Math.sign(falta) * e.sentido * Math.min(Math.abs(falta),
                                                          dt / T_POSTO);
      } else if (!e.pronto) {
        e.pronto = true;                        // chegou: põe-se em guarda
        for (const h of e.homens) pose(h, "parar");
      }
    }
    if (A.pronto && B.pronto) {
      if (!guiao) {
        guiao = montarGuiao();
        estado.innerHTML = "Travaram no posto <b>" + (disputado + 1) + "</b> de "
          + N_POSTOS + ". Guião escrito: <b>"
          + guiao.filter((e) => e.faz === "atirar").length + "</b> tiros, <b>"
          + guiao.filter((e) => e.mata).length + "</b> com nome.";
      }
      tocarGuiao(dt);
    }
  }
  moverFlechas(dt);

  for (const rei of ["A", "B"]) {
    const e = exercitos[rei];
    const alvo = e.posto + e.sentido * e.prog;
    e.homens.forEach((h, i) => {
      // ── QUEM CAI FICA ONDE CAIU ───────────────────────────────────────
      // Não há animação de morte, e não faz falta: a esta escala uma queda
      // para a frente em meio segundo lê-se perfeitamente. O tocador PÁRA,
      // senão o morto continuava em guarda enquanto tomba.
      if (h.caido) {
        h.caido.t = Math.min(1, h.caido.t + dt / 0.65);
        const u = h.caido.t;
        _euler.set(-(Math.PI / 2) * u * u * (3 - 2 * u), h.raiz.rotation.y, 0, "YXZ");
        h.raiz.quaternion.setFromEuler(_euler);
        h.raiz.position.y = h.chao - 0.5 * u;
        return;
      }
      h.mix.update(dt);
      // ── O AVANÇO DA VAGA ──────────────────────────────────────────────
      // A linha de guarda é o lugar de cada um; a vaga que ataca sai dela e
      // volta. Guardar isto como um DESVIO à linha (e não como uma posição
      // nova) é o que faz o recuo ser de graça: manda-se o desvio a zero.
      if (travados) {
        const dAv = h.avancoAlvo - h.avanco;
        if (Math.abs(dAv) > 0.03) {
          h.avanco += Math.sign(dAv) * Math.min(Math.abs(dAv), 6 * dt);
          if (h.pose !== "bater") pose(h, "andar");
        } else if (h.pose === "andar") {
          pose(h, "parar");
        }
        if (h.pose === "bater"
            && (h.acao.bater.paused || h.acao.bater.time >= h.golpe - 1e-3))
          pose(h, "parar");
      }
      // a corda a ser puxada: o braço direito recua enquanto o tiro se prepara.
      // Aplica-se DEPOIS do tocador, senão a animação escrevia por cima.
      if (h.puxa !== null && h.puxa !== undefined) {
        h.puxa = Math.min(0.7, h.puxa + dt);
        const b = osso(h.raiz, "lowerarm.R");
        if (b) b.quaternion.multiply(
          _qPuxa.setFromAxisAngle(_eixoPuxa, -1.25 * (h.puxa / 0.7)));
      }
      // cada homem uma casa atrás do da frente, em metros e não em postos:
      // um posto é uma unidade de TEMPO, e a coluna é uma coisa física
      const m = COMP * (alvo + 0.5) / N_POSTOS
        - e.sentido * i * 6.2 + e.sentido * h.avanco;
      const rumo = noCaminho(Math.max(2, Math.min(COMP - 2, m)), _p)
        + (e.sentido < 0 ? Math.PI : 0);
      const lat = ((i % 2) * 2 - 1) * 1.9;
      _p.x += Math.cos(rumo + Math.PI / 2) * lat;
      _p.z += Math.sin(rumo + Math.PI / 2) * lat;
      h.raiz.position.copy(_p);
      h.chao = _p.y;
      // a peça olha para +Y no Blender, que a exportação manda para -Z: um
      // quarto de volta a menos do que a conta óbvia
      h.raiz.rotation.y = -rumo - Math.PI / 2;
    });
  }
}

let ultimo = performance.now();
function passo() {
  requestAnimationFrame(passo);
  const agora = performance.now();
  const dt = Math.min((agora - ultimo) / 1000, 0.1);
  ultimo = agora;
  avancar(dt);
}
window.avancar = avancar;      // para conferir com o painel escondido
window.ex = exercitos;
window.diag = () => ({ flechas: flechas.count, noAr: voo.filter((f) => f.cravada < 0).length,
  caidos: [...exercitos.A.homens, ...exercitos.B.homens].filter((h) => h.caido).length,
  guiao: guiao ? guiao.length : 0, i: iGuiao, t: Math.round(tGuiao) });
document.getElementById("carga").remove();
passo();

// ── AS CÂMARAS ──────────────────────────────────────────────────────────────
// a camara enquadra o POSTO DISPUTADO -- que e onde a cena esta, e nao o
// meio geometrico da estrada
function olhar(de, alto, dist) {
  const q = postos[Math.max(0, Math.min(N_POSTOS - 1, disputado))];
  ctrl.target.copy(q.v).add(new THREE.Vector3(0, 3, 0));
  cam.position.set(q.v.x + Math.cos(q.rumo + de) * dist, q.v.y + alto,
                   q.v.z + Math.sin(q.rumo + de) * dist);
  ctrl.update();
}
for (const b of document.querySelectorAll("#hud button")) {
  b.onclick = () => {
    const c = b.dataset.c;
    if (c === "outra") {
      travados = false;
      guiao = null; iGuiao = 0; tGuiao = 0;
      voo.length = 0;
      estado.innerHTML = "&nbsp;";
      for (const rei of ["A", "B"]) {
        const e = exercitos[rei];
        e.posto = rei === "A" ? -1 : N_POSTOS;
        e.prog = 0;
        e.pronto = false;
        for (const h of e.homens) {
          h.caido = null; h.puxa = null; h.avanco = 0; h.avancoAlvo = 0;
          pose(h, "andar");
        }
        for (const h of e.homens) {
          h.acao.parar.fadeOut(0.3);
          h.acao.andar.reset().fadeIn(0.3).play();
        }
      }
      return;
    }
    if (c === "ver") olhar(Math.PI / 2 + 0.55, 15, 48);
    if (c === "lado") olhar(Math.PI / 2, 9, 56);
    if (c === "alto") olhar(0, 95, 45);
  };
}
olhar(Math.PI / 2 + 0.55, 15, 48);

const med = document.getElementById("med");
setInterval(() => {
  med.innerHTML = "<b>" + mapa.fps + "</b> fps<br>"
    + (exercitos.A.homens.length + exercitos.B.homens.length) + " figuras animadas<br>"
    + N_POSTOS + " postos em " + Math.round(COMP) + " m<br>"
    + flechas.count + " flechas no ar e no chão<br>"
    + [...exercitos.A.homens, ...exercitos.B.homens].filter((h) => h.caido).length
    + " caídos";
}, 500);
</script>
