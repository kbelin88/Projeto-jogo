<!doctype html>
<meta charset="utf-8">
<title>Bancada dos EUA: o relevo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1418; color: #e8dcc0;
               font: 13px system-ui, sans-serif; overflow: hidden; }
  #palco { position: fixed; inset: 0; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 5; width: 230px;
         background: rgba(20,15,8,.88); border: 1px solid #6b5836;
         border-radius: 8px; padding: 10px 12px; }
  #hud h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: .06em; }
  #hud button { display: inline-block; margin: 3px 2px; padding: 5px 8px; cursor: pointer;
                background: #3a2e18; color: #e8dcc0; border: 1px solid #6b5836; border-radius: 5px; }
  #hud button.on { background: #8a6a2a; }
  #hud h2 { font-size: 11px; margin: 9px 0 2px; color: #cbbd94; font-weight: 600; letter-spacing: .05em; }
  #hud p { color: #cbbd94; font-style: italic; line-height: 1.45; margin: 8px 0 0; }
  #carga { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
           background: #0d1418; z-index: 9; font-size: 15px; color: #cbbd94; text-align: center; }
  .nome { position: fixed; z-index: 4; transform: translate(-50%, -150%); pointer-events: none;
          color: #fff8e6; font: 600 12px Georgia, serif; text-shadow: 0 1px 3px #000, 0 0 6px #000; white-space: nowrap; }
  .nome.cap { font-size: 15px; color: #ffe9a8; }
</style>
<div id="palco"></div>
<div id="carga">a montar o relevo dos EUA...</div>
<div id="hud">
  <h1>BANCADA &mdash; EUA, O RELEVO</h1>
  <h2>VISTA</h2>
  <div id="vistas"></div>
  <h2>ALTURA DO CUME MAIS ALTO</h2>
  <div id="alturas"></div>
  <h2>SOL</h2>
  <div id="sois"></div>
  <p>Relevo em bruto do <code>preparar_usa.py</code>. Não é o mapa do jogo: falta a falésia,
     a praia, as árvores, as aldeias e a estrada pintada. Serve para escolher a altura.</p>
</div>

<script type="module">
// ── PORQUE EXISTE (11/11) ────────────────────────────────────────────────────
// O forno demora ~100 s por volta e ainda so sabe cozer a Iberia. Antes de o
// abrir ao segundo mapa ha uma pergunta que se responde em segundos: com o
// relevo REAL dos EUA na grelha do jogo, as Rochosas leem como montanhas, de
// longe (a moldura de gravacao) e de perto? E a que altura? Na Iberia o cume
// ficou a 150 m num mapa de 2,8 km; este mapa tem 6 km.
import * as THREE from "./vendor/three.module.js";
import { OrbitControls } from "./vendor/controls/OrbitControls.js";

addEventListener("error", (e) => queixa(e.message));
addEventListener("unhandledrejection", (e) => queixa(String(e.reason)));
function queixa(msg) {
  const c = document.getElementById("carga");
  if (c) { c.style.display = "flex"; c.innerHTML = "<div><b style='color:#e0a0a0'>não consegui montar a cena</b><br>" + msg +
    "<br><br>Falta cozer? <code>python ferramentas/cena/preparar_usa.py</code></div>"; }
}

const fresco = "?t=" + Date.now();
const meta = await (await fetch("./usa_relevo.json" + fresco)).json();
const bruto = new Uint16Array(await (await fetch("./usa_relevo.bin" + fresco)).arrayBuffer());
const { tw, th, cel_m } = meta;
if (bruto.length !== tw * th) throw new Error("usa_relevo.bin não bate com a grelha " + tw + "x" + th);
const LX = tw * cel_m, LY = th * cel_m;
const alt01 = (k) => bruto[k] / 65535 * 1.1 - 0.1;        // 1 = o cume mais alto; < 0 = fundo do mar

const palco = document.getElementById("palco");
const rend = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
rend.setPixelRatio(Math.min(devicePixelRatio, 2));
rend.setSize(innerWidth, innerHeight);
rend.toneMapping = THREE.ACESFilmicToneMapping;
rend.toneMappingExposure = 1.05;
rend.shadowMap.enabled = true;
rend.shadowMap.type = THREE.PCFSoftShadowMap;
palco.appendChild(rend.domElement);

const cena = new THREE.Scene();
cena.background = new THREE.Color(0xbfd3e0);
cena.fog = new THREE.Fog(0xcfd9dc, 5200, 16000);
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 5, 40000);
const ctrl = new OrbitControls(cam, rend.domElement);
ctrl.maxPolarAngle = Math.PI * 0.49;
ctrl.enableDamping = true;

// ---- o chao --------------------------------------------------------------------
const geo = new THREE.PlaneGeometry(LX, LY, tw - 1, th - 1);
geo.rotateX(-Math.PI / 2);                                 // x = este, z = sul, y = cima
const pos = geo.attributes.position;
const tex = await new THREE.TextureLoader().loadAsync("./usa_cor.jpg" + fresco);
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = 8;
const chao = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95, metalness: 0 }));
chao.castShadow = chao.receiveShadow = true;
cena.add(chao);

// ---- o sudoeste (M2, 12/11): o Grand Canyon e as mesas ------------------------------
// A MESMA geometria que o forno coze (`ferramentas/cena/sudoeste.py`), pousada na
// grelha desta bancada pelo `preparar_usa.py`. As alturas sao as do cume a 220 m:
// com outra altura escala-se o grupo (o chao escala da mesma maneira).
const grupoSW = new THREE.Group();
cena.add(grupoSW);
let sw = null;
try { sw = await (await fetch("./usa_sudoeste.json" + fresco)).json(); } catch (e) { console.warn("sem usa_sudoeste.json", e); }
const matSWcor = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 });
const matSWbarro = new THREE.MeshStandardMaterial({ color: 0xb9b2a6, roughness: 1, metalness: 0 });
const malhasSW = [];
if (sw) {
  for (const p of sw.pecas) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(p.v, 3));
    g.setAttribute("color", new THREE.Float32BufferAttribute(p.cor, 3));
    // a normal vem do preparador, por canto: lisa ao longo da parede, viva na beira do degrau
    g.setAttribute("normal", new THREE.Float32BufferAttribute(p.n, 3));
    const m = new THREE.Mesh(g, matSWcor);
    m.castShadow = m.receiveShadow = true;
    m.name = p.nome;
    grupoSW.add(m);
    malhasSW.push(m);
  }
  // o rio: uma fita lisa ao nivel da agua
  const P = sw.rio.v, W = sw.rio.w, pos = [], idx = [];
  for (let k = 0; k < W.length; k++) {
    const a = Math.max(0, k - 1), b = Math.min(W.length - 1, k + 1);
    let tx = P[b * 3] - P[a * 3], tz = P[b * 3 + 2] - P[a * 3 + 2];
    const n = Math.hypot(tx, tz) || 1; tx /= n; tz /= n;
    for (const l of [-1, 1]) pos.push(P[k * 3] - tz * W[k] * l, P[k * 3 + 1], P[k * 3 + 2] + tx * W[k] * l);
    if (k) idx.push(2 * k - 2, 2 * k - 1, 2 * k, 2 * k - 1, 2 * k + 1, 2 * k);
  }
  const gr = new THREE.BufferGeometry();
  gr.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  gr.setIndex(idx);
  gr.computeVertexNormals();
  grupoSW.add(new THREE.Mesh(gr, new THREE.MeshStandardMaterial({ color: 0x1d5a5e, roughness: 0.2, metalness: 0.1, side: THREE.DoubleSide })));
}

let HMAX = 220;
function altura_em(xu, yu) {                               // unidades do mapa -> metros de altura
  const i = Math.max(0, Math.min(tw - 1, Math.floor((xu - meta.x0) / meta.cel)));
  const j = Math.max(0, Math.min(th - 1, Math.floor((yu - meta.y0) / meta.cel)));
  return Math.max(0, alt01(j * tw + i)) * HMAX;
}
const m_de = (xu, yu) => [(xu - meta.x0) * meta.m_por_un - LX / 2, (yu - meta.y0) * meta.m_por_un - LY / 2];

// ---- o mar ---------------------------------------------------------------------
const mar = new THREE.Mesh(new THREE.PlaneGeometry(LX * 6, LY * 6),
  new THREE.MeshStandardMaterial({ color: 0x1f5d78, roughness: 0.25, metalness: 0.1, transparent: true, opacity: 0.86 }));
mar.rotation.x = -Math.PI / 2;
mar.position.y = 0.4;
cena.add(mar);

// ---- a luz ---------------------------------------------------------------------
cena.add(new THREE.HemisphereLight(0xcfe2f5, 0x6b5a3a, 0.75));
const sol = new THREE.DirectionalLight(0xffe2b0, 3.0);
sol.castShadow = true;
sol.shadow.mapSize.set(4096, 4096);
const sc = sol.shadow.camera;
sc.left = -LX * 0.56; sc.right = LX * 0.56; sc.top = LY * 0.75; sc.bottom = -LY * 0.75; sc.near = 100; sc.far = 16000;
sol.shadow.bias = -0.0006; sol.shadow.normalBias = 3.0;
cena.add(sol, sol.target);
function por_sol(graus) {
  const e = THREE.MathUtils.degToRad(graus), az = THREE.MathUtils.degToRad(215);
  sol.position.set(Math.sin(az) * Math.cos(e), Math.sin(e), -Math.cos(az) * Math.cos(e)).multiplyScalar(7000);
  sol.color.set(graus < 30 ? 0xffd9a0 : 0xfff1dc);
}

// ---- a rede, pousada no chao -------------------------------------------------------
const grupoRede = new THREE.Group();
cena.add(grupoRede);
const etiquetas = [];
function montar_rede() {
  grupoRede.clear();
  for (const e of etiquetas) e.el.remove();
  etiquetas.length = 0;
  const matE = new THREE.MeshStandardMaterial({ color: 0xe2c98a, roughness: 1 });
  for (const pts of meta.estradas) {
    const curva = new THREE.CatmullRomCurve3(pts.map(([x, y]) => { const [mx, mz] = m_de(x, y); return new THREE.Vector3(mx, altura_em(x, y) + 2.5, mz); }));
    // um tubo meio enterrado: ~11 m de largura a vista, como a estrada real do jogo
    grupoRede.add(new THREE.Mesh(new THREE.TubeGeometry(curva, 120, 5.5, 5, false), matE));
  }
  for (const c of meta.cidades) {
    const [mx, mz] = m_de(c.x, c.y), h = altura_em(c.x, c.y);
    const r = c.capital ? 62 : 44;                        // o raio de uma aldeia do jogo, mais ou menos
    const cor = { noroeste: 0x2f6fb5, sudoeste: 0x2a9d8f, nordeste: 0xc8443c, sudeste: 0xe08a1e }[c.rei] || 0xf2ead8;
    const muro = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.04, c.capital ? 22 : 14, 28),
      new THREE.MeshStandardMaterial({ color: cor, roughness: 0.8 }));
    muro.position.set(mx, h + (c.capital ? 11 : 7), mz);
    muro.castShadow = true;
    grupoRede.add(muro);
    const el = document.createElement("div");
    el.className = "nome" + (c.capital ? " cap" : "");
    el.textContent = c.nome;
    document.body.appendChild(el);
    etiquetas.push({ el, p: new THREE.Vector3(mx, h + 40, mz) });
  }
}

function por_altura(h) {
  HMAX = h;
  for (let k = 0; k < tw * th; k++) pos.setY(k, alt01(k) * h);
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  grupoSW.scale.y = h / 220;
  montar_rede();
}

// ---- as vistas: sempre as mesmas, para comparar do mesmo sitio ----------------------
const celula = (j, i, y) => { const x = -LX / 2 + i * LX / (tw - 1), z = -LY / 2 + j * LY / (th - 1); return new THREE.Vector3(x, y !== undefined ? y * HMAX / 220 : Math.max(0, alt01(Math.round(j) * tw + Math.round(i))) * HMAX, z); };
const cidade = (id) => { const c = meta.cidades.find((x) => x.id === id); const [x, z] = m_de(c.x, c.y); return new THREE.Vector3(x, altura_em(c.x, c.y), z); };
const VISTAS = {
  "gravação": () => { const d = LY / 2 / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) * 1.02; return [new THREE.Vector3(0, d * 0.82, d * 0.62), new THREE.Vector3(0, 0, 120)]; },
  "Rochosas": () => { const a = cidade("denver"); return [a.clone().add(new THREE.Vector3(520, 260, 420)), a.clone().add(new THREE.Vector3(-300, 60, -60))]; },
  "Oeste": () => { const a = cidade("salt_lake_city"); return [a.clone().add(new THREE.Vector3(-200, 900, 1500)), a.clone().add(new THREE.Vector3(0, 0, -100))]; },
  "Apalaches": () => { const a = cidade("pittsburgh"); return [a.clone().add(new THREE.Vector3(500, 330, 620)), a.clone().add(new THREE.Vector3(-150, 20, 200))]; },
  "Florida": () => { const a = cidade("orlando"); return [a.clone().add(new THREE.Vector3(350, 420, 700)), a]; },
  // o sudoeste (M2): o canyon e as mesas de perto, com o sol rasante, e o sudoeste inteiro
  "Canyon": () => { const a = celula(339, 280, 85); return [a.clone().add(new THREE.Vector3(120, 95, 230)), a.clone().add(new THREE.Vector3(-30, -30, -20))]; },
  "Canyon fundo": () => { const a = celula(340.5, 284, 38); return [a.clone().add(new THREE.Vector3(-55, 0, 10)), a.clone().add(new THREE.Vector3(60, -8, -10))]; },
  "Mesas": () => { const a = celula(338, 315, 100); return [a.clone().add(new THREE.Vector3(-170, 40, 170)), a.clone().add(new THREE.Vector3(10, -20, 0))]; },
  "Sudoeste": () => { const a = celula(336, 292, 85); return [a.clone().add(new THREE.Vector3(140, 420, 640)), a.clone()]; },
  "Lagos": () => { const a = cidade("chicago"); return [a.clone().add(new THREE.Vector3(-200, 520, 800)), a.clone().add(new THREE.Vector3(150, 0, -150))]; },
};
function ir(nome) { const [p, alvo] = VISTAS[nome](); cam.position.copy(p); ctrl.target.copy(alvo); ctrl.update(); }

function botoes(idCaixa, valores, aoClicar, inicial) {
  const caixa = document.getElementById(idCaixa);
  for (const v of valores) {
    const b = document.createElement("button");
    b.textContent = v;
    b.onclick = () => { for (const o of caixa.children) o.classList.toggle("on", o === b); aoClicar(v); };
    if (v === inicial) b.classList.add("on");
    caixa.appendChild(b);
  }
}
botoes("vistas", Object.keys(VISTAS), ir, "gravação");
botoes("alturas", ["150 m", "220 m", "300 m", "400 m"], (v) => por_altura(parseInt(v, 10)), "220 m");
botoes("sois", ["20°", "35°", "55°"], (v) => por_sol(parseInt(v, 10)), "20°");

por_sol(20);                // o sol do jogo (a luz dourada do mapa3d.js), escolhido a 12/11
por_altura(220);            // a altura do jogo (escolhida a 12/11)
ir("gravação");
document.getElementById("carga").style.display = "none";

// para as ferramentas e para o Claude: as mesmas vistas, por nome
// `barro(true)`: o chao em cinzento liso, sem pintura -- para julgar a FORMA (M2)
const matCor = chao.material, matBarro = new THREE.MeshStandardMaterial({ color: 0xb9b2a6, roughness: 1, metalness: 0 });
const barro = (v) => { chao.material = v ? matBarro : matCor; for (const m of malhasSW) m.material = v ? matSWbarro : matSWcor; };
window.bancada = { ir, por_altura, por_sol, barro, cam, ctrl, meta, rend, cena, grupoSW, celula };

addEventListener("resize", () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); rend.setSize(innerWidth, innerHeight); });
const v = new THREE.Vector3();
(function quadro() {
  requestAnimationFrame(quadro);
  ctrl.update();
  rend.render(cena, cam);
  for (const e of etiquetas) {
    v.copy(e.p).project(cam);
    const visivel = v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05;
    e.el.style.display = visivel ? "" : "none";
    if (visivel) { e.el.style.left = ((v.x + 1) / 2 * innerWidth) + "px"; e.el.style.top = ((1 - v.y) / 2 * innerHeight) + "px"; }
  }
})();
</script>
