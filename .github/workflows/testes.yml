name: testes

# Gatilho: todo push e todo pull request, qualquer branch
on: [push, pull_request]

jobs:
  suite:
    runs-on: ubuntu-latest   # a VM limpa que nasce pra cada rodada

    steps:
      # Passo 1: clonar o teu repo dentro da VM
      - uses: actions/checkout@v4

      # Passo 2: instalar Node na VM (ela nasce pelada)
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Passo 3: todos os testes do motor, um a um (32 em 22/09).
      # O shell do Actions roda com "fail fast": o primeiro
      # exit code != 0 derruba o passo inteiro.
      - name: Testes do motor
        run: |
          for t in testes/test_*.js; do
            echo "== $t"
            node "$t"
          done

      # Passo 4: TODOS os smokes da arena (stubs em modo estrito, sem
      # rede nem GPU). Ate 22/09 esta lista tinha 5 nomes escritos a mao e o
      # CI nunca correu os outros 8 -- o fog, a rede, a estrada, os modulos,
      # o hover, a batalha. Conferido num clone limpo: os 13 passam sem nada
      # que esteja fora do git. Por padrao, e nao por lista, para um smoke
      # novo entrar sozinho.
      - name: Smokes da arena
        run: |
          for t in testes_arena/*.js; do
            echo "== $t"
            node "$t"
          done